name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit + scenario regression tests
        run: pytest --cov=lacc --cov-report=term-missing

      - name: Run demo scenario
        run: lacc demo --config configs/demo.yaml --out reports

      - name: Upload demo report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/
