[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lacc"
version = "0.1.0"
description = "When does a learned ACC fail, and does it know? Uncertainty-aware safety validation of a learned car-following policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rakshit Kulkarni" }]
keywords = ["ADAS", "ACC", "SOTIF", "scenario-based testing", "uncertainty", "OpenSCENARIO"]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
# Added in later phases:
# ml = ["torch>=2.2", "mlflow>=2.10"]
# scenarios = ["scenariogeneration>=0.14"]

[project.scripts]
lacc = "lacc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
